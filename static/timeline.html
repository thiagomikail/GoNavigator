<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline - {{TRIP_ID}}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f0f0f;
            --bg-card: #1a1a1a;
            --bg-card-hover: #252525;
            --accent: #00d4aa;
            --accent-dim: #00a088;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --border: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 40px 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 1px solid var(--border);
        }

        header h1 {
            font-size: 2.2em;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        header .dates {
            color: var(--accent);
            font-size: 1em;
            font-weight: 400;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 40px;
        }

        .toggle-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            color: var(--text-secondary);
            transition: all 0.2s ease;
        }

        .toggle-btn:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }

        .toggle-btn.active {
            background: var(--accent);
            color: var(--bg-dark);
            border-color: var(--accent);
        }

        /* VERTICAL TIMELINE */
        .timeline-vertical {
            position: relative;
            padding-left: 30px;
        }

        .timeline-vertical::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom, var(--accent), var(--accent-dim), var(--border));
        }

        .timeline-vertical .event {
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            transition: all 0.2s ease;
        }

        .timeline-vertical .event:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent);
            transform: translateX(8px);
        }

        .timeline-vertical .event::before {
            content: '';
            position: absolute;
            left: -34px;
            top: 28px;
            width: 10px;
            height: 10px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--accent);
        }

        /* HORIZONTAL TIMELINE */
        .timeline-horizontal {
            display: flex;
            overflow-x: auto;
            padding: 20px 10px 40px;
            gap: 20px;
            scroll-snap-type: x mandatory;
        }

        .timeline-horizontal::-webkit-scrollbar {
            height: 8px;
        }

        .timeline-horizontal::-webkit-scrollbar-track {
            background: var(--bg-card);
            border-radius: 4px;
        }

        .timeline-horizontal::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 4px;
        }

        .timeline-horizontal .event {
            flex: 0 0 300px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            scroll-snap-align: start;
            transition: all 0.2s ease;
        }

        .timeline-horizontal .event:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent);
        }

        /* Event Styling */
        .event .day-badge {
            display: inline-block;
            background: var(--accent);
            color: var(--bg-dark);
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .event h3 {
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .event .location {
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 4px;
        }

        .event .location::before {
            content: '📍 ';
        }

        .event .description {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 12px;
            line-height: 1.5;
        }

        .hidden {
            display: none;
        }

        .loading {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
        }

        .loading .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.6em;
            }

            .timeline-horizontal .event {
                flex: 0 0 260px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1 id="trip-title">{{TRIP_ID}}</h1>
            <div class="dates" id="trip-dates"></div>
        </header>

        <div class="controls">
            <button class="toggle-btn active" id="btn-vertical" onclick="setLayout('vertical')">📋 Vertical</button>
            <button class="toggle-btn" id="btn-horizontal" onclick="setLayout('horizontal')">📊 Horizontal</button>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Carregando timeline...</p>
        </div>

        <div id="timeline-vertical" class="timeline-vertical hidden"></div>
        <div id="timeline-horizontal" class="timeline-horizontal hidden"></div>
    </div>

    <script>
        const tripId = "{{TRIP_ID}}";
        let currentLayout = 'vertical';
        let events = [];

        async function loadTimeline() {
            try {
                const res = await fetch(`/api/trips/${tripId}/timeline/data`);
                const data = await res.json();

                if (data.title) document.getElementById('trip-title').textContent = data.title;
                if (data.dates) document.getElementById('trip-dates').textContent = data.dates;

                events = data.events || [];
                renderTimeline();
            } catch (e) {
                console.error(e);
                document.getElementById('loading').innerHTML = '<p>Erro ao carregar timeline</p>';
            }
        }

        function renderTimeline() {
            document.getElementById('loading').classList.add('hidden');

            let html = '';
            events.forEach((e, i) => {
                html += `
                    <div class="event">
                        <span class="day-badge">${e.day || `Day ${i + 1}`}</span>
                        <h3>${e.title || e.location || ''}</h3>
                        ${e.location && e.title ? `<div class="location">${e.location}</div>` : ''}
                        ${e.description ? `<div class="description">${e.description}</div>` : ''}
                    </div>
                `;
            });

            document.getElementById('timeline-vertical').innerHTML = html;
            document.getElementById('timeline-horizontal').innerHTML = html;

            setLayout(currentLayout);
        }

        function setLayout(layout) {
            currentLayout = layout;
            document.getElementById('timeline-vertical').classList.toggle('hidden', layout !== 'vertical');
            document.getElementById('timeline-horizontal').classList.toggle('hidden', layout !== 'horizontal');
            document.getElementById('btn-vertical').classList.toggle('active', layout === 'vertical');
            document.getElementById('btn-horizontal').classList.toggle('active', layout === 'horizontal');
        }

        loadTimeline();
    </script>
</body>

</html>
