<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline - {{TRIP_ID}}</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Lato:wght@300;400&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Lato', sans-serif;
            background: linear-gradient(180deg, #fdf2f4 0%, #ffffff 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8em;
            font-weight: 600;
            color: #2c3e50;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        header .timeline-label {
            font-family: 'Brush Script MT', cursive;
            font-size: 2em;
            color: #888;
            font-style: italic;
        }

        header .dates {
            font-size: 1.1em;
            color: #666;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        /* Classic Timeline */
        .timeline {
            position: relative;
            padding: 20px 0;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 0;
            bottom: 0;
            width: 2px;
            background: #ddd;
        }

        .timeline-item {
            display: flex;
            justify-content: flex-end;
            padding-right: 50%;
            position: relative;
            margin-bottom: 50px;
        }

        .timeline-item:nth-child(even) {
            justify-content: flex-start;
            padding-right: 0;
            padding-left: 50%;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 30px;
            transform: translateX(-50%);
            width: 12px;
            height: 12px;
            background: #ddd;
            border-radius: 50%;
            border: 3px solid #fff;
            box-shadow: 0 0 0 2px #ddd;
        }

        .timeline-content {
            max-width: 320px;
            padding: 0 30px;
            text-align: right;
        }

        .timeline-item:nth-child(even) .timeline-content {
            text-align: left;
        }

        .day-label {
            font-family: 'Playfair Display', serif;
            font-size: 0.9em;
            font-weight: 600;
            color: #666;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .location {
            font-family: 'Lato', sans-serif;
            font-size: 1.1em;
            color: #444;
            font-weight: 300;
            line-height: 1.4;
        }

        .timeline-image {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #fff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            position: absolute;
            right: calc(50% + 40px);
            top: 0;
        }

        .timeline-item:nth-child(even) .timeline-image {
            right: auto;
            left: calc(50% + 40px);
        }

        .description {
            font-size: 0.9em;
            color: #888;
            margin-top: 8px;
            font-weight: 300;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 60px;
            color: #888;
        }

        /* Mobile */
        @media (max-width: 768px) {
            .timeline::before {
                left: 30px;
            }

            .timeline-item,
            .timeline-item:nth-child(even) {
                padding-left: 80px;
                padding-right: 0;
                justify-content: flex-start;
            }

            .timeline-item::before {
                left: 30px;
            }

            .timeline-content,
            .timeline-item:nth-child(even) .timeline-content {
                text-align: left;
                max-width: 100%;
            }

            .timeline-image,
            .timeline-item:nth-child(even) .timeline-image {
                display: none;
            }

            header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1 id="trip-title">{{TRIP_TITLE}}</h1>
            <div class="timeline-label">Timeline</div>
            <div class="dates" id="trip-dates"></div>
        </header>

        <div id="loading" class="loading">Carregando timeline...</div>
        <div id="timeline" class="timeline" style="display:none;"></div>
    </div>

    <script>
        const tripId = "{{TRIP_ID}}";

        async function loadTimeline() {
            try {
                const res = await fetch(`/api/trips/${tripId}/timeline/data`);
                const data = await res.json();

                // Set header info
                if (data.title) {
                    document.getElementById('trip-title').textContent = data.title;
                }
                if (data.dates) {
                    document.getElementById('trip-dates').textContent = data.dates;
                }

                renderTimeline(data.events || []);
            } catch (e) {
                console.error(e);
                document.getElementById('loading').textContent = 'Erro ao carregar timeline';
            }
        }

        function renderTimeline(events) {
            document.getElementById('loading').style.display = 'none';
            const container = document.getElementById('timeline');
            container.style.display = 'block';

            let html = '';
            events.forEach((e, i) => {
                html += `
                    <div class="timeline-item">
                        <div class="timeline-content">
                            <div class="day-label">${e.day || `DAY ${i + 1}`}</div>
                            <div class="location">${e.location || e.title}</div>
                            ${e.description ? `<div class="description">${e.description}</div>` : ''}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        loadTimeline();
    </script>
</body>

</html>
