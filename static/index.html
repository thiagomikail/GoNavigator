<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoNavigator - Gestão de Viagens</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background-color: #f5f5f7; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #1d1d1f; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #333; }
        input[type="text"], input[type="file"], input[type="password"] { width: 100%; padding: 10px; border: 1px solid #d2d2d7; border-radius: 8px; box-sizing: border-box; }
        button { background-color: #0071e3; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 16px; width: 100%; font-weight: 500; }
        button:hover { background-color: #0077ed; }
        #status { margin-top: 20px; padding: 10px; border-radius: 8px; display: none; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Nova Viagem</h1>
        <p>Faça upload do roteiro (PDF) e defina o código da viagem.</p>
        
        <div class="form-group">
            <label for="tripId">Código da Viagem (ex: PARIS24)</label>
            <input type="text" id="tripId" placeholder="PARIS24" required>
        </div>

        <div class="form-group">
            <label for="pdfFile">Arquivo PDF</label>
            <input type="file" id="pdfFile" accept=".pdf" required>
        </div>

        <!-- Optional Security: Simple Password -->
        <div class="form-group">
            <label for="adminPass">Senha de Admin</label>
            <input type="password" id="adminPass" placeholder="Sua senha secreta">
        </div>

        <button onclick="uploadTrip()">Enviar Roteiro</button>

        <div id="status"></div>
    </div>

    <script>
        async function uploadTrip() {
            const tripId = document.getElementById('tripId').value.toUpperCase();
            const fileInput = document.getElementById('pdfFile');
            const password = document.getElementById('adminPass').value;
            const statusDiv = document.getElementById('status');

            if (!tripId || fileInput.files.length === 0) {
                showStatus('Preencha o código e selecione um arquivo.', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('trip_id', tripId);
            // In a real app, use Authorization header
            formData.append('admin_key', password);

            statusDiv.style.display = 'block';
            statusDiv.textContent = 'Enviando e processando... (Aguarde)';
            statusDiv.className = '';

            try {
                const response = await fetch('/upload_trip', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                
                if (response.ok) {
                    showStatus('Sucesso! Viagem ' + tripId + ' criada.', 'success');
                    document.getElementById('tripId').value = '';
                    fileInput.value = '';
                } else {
                    showStatus('Erro: ' + result.detail, 'error');
                }
            } catch (e) {
                showStatus('Erro de conexão.', 'error');
            }
        }

        function showStatus(msg, type) {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = type;
            el.style.display = 'block';
        }
    </script>
</body>
</html>
